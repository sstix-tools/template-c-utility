name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build utility
        run: |
          make clean
          make CC=${{ matrix.compiler }}

      - name: Test execution and help flag
        run: |
          ./template-c-utility --help
          ./template-c-utility --version
          ./template-c-utility status
          ./template-c-utility run
